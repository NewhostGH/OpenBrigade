name: Docs & brand review

# An AI agent checks each PR for docs that no longer match the code and for text that
# breaks docs/dev/brand-identity.md, then leaves one comment. It never pushes.
# Runs once when a PR is opened or marked ready (not on every push) to limit usage.
# Re-run on demand by commenting "@claude review docs" (handled by claude.yml).

on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  docs-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Review docs and brand compliance
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --model claude-sonnet-5
            --max-turns 20
            --allowed-tools "Read,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            You review this pull request for two things only. Read AGENTS.md and
            docs/dev/brand-identity.md first, then `git diff ${{ github.event.pull_request.base.sha }}...HEAD`.

            1. Docs drift: for each change to routes, permissions, config keys, env
               variables, artisan commands, settings, conventions, folder layout or admin
               procedures, find the owning doc (docs/README.md index) and check it still
               matches. List each doc that needs an update, with the exact section and
               what to change. Flag new docs missing from docs/README.md, and docs made
               obsolete by the PR.
            2. Brand compliance of the added lines only: French copy (vouvoiement, sentence
               case, vocabulary table, typography, formats), symbols (em dash sparingly, no en dash, no
               emoji), color tokens, icon mapping, image alt text.

            Post exactly one comment with `gh pr comment ${{ github.event.pull_request.number }} --body ...`, in English,
            grouped under "Docs" and "Brand", each item as `file:line - issue - fix`.
            If nothing is wrong, post a one-line comment saying so. Do not edit files,
            do not push, do not review code correctness.
